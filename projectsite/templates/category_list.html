{% extends 'base.html' %} {% load static %} {% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">Categories</h4>
    <div class="row"><div class="col-md-12"><div class="card">
      <div class="card-header">
        <div class="card-title">List of Categories</div>
      </div>
      <br />
      <div class="col-md-12 row">
        <div class="col-md-6"></div>
        <div class="col-md-6">
          <div class="pull-right">
            <a href="{% url 'category-add' %}" class="btn btn-success btn-rounded">Add Category</a>
          </div>
        </div>
      </div>
      <div class="card-body">
        <table class="table table-striped mt-3">
          <thead><tr><th>Name</th><th>Action</th></tr></thead>
          <tbody>
            {% for object in object_list %}
            <tr>
              <td>{{ object.name }}</td>
              <td>
                <a href="categories/{{ object.id }}">Edit</a>
                <a href="categories/{{ object.id }}/delete" class="text-danger">Delete</a>
              </td>
            </tr>
            {% empty %}
            <tr><td colspan="2" style="text-align:center">No Records Found</td></tr>
            {% endfor %}
          </tbody>
        </table>
        {% include 'includes/pagination.html' %}
      </div>
    </div></div></div>
  </div>
</div>
{% endblock %}
